apiVersion: v1
kind: Secret
metadata:
  name: fastapi-app-secret
  # namespace: <your-namespace> # Uncomment and replace <your-namespace>
type: Opaque
stringData:
  # Replace with your actual database credentials
  DB_HOST: "your-mysql-host"
  DB_USER: "your-user"
  DB_PASSWORD: "your-password"
  DB_NAME: "your-database"
